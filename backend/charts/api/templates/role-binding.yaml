apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ template "vydon-api.fullname" . }}-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "vydon-api.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "vydon-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
