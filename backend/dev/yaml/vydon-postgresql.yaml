apiVersion: v1
kind: Service
metadata:
  name: vydon-postgresql
  namespace: vydon
spec:
  selector:
    app: vydon-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vydon-postgresql
  namespace: vydon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vydon-postgresql
  template:
    metadata:
      labels:
        app: vydon-postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:15
          env:
            - name: POSTGRES_DB
              value: vydon
            - name: POSTGRES_PASSWORD
              value: foofar
            - name: PGUSER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vydon-postgres
