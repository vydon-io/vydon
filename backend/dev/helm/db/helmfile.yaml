repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: vydon-postgresql
    chart: bitnami/postgresql
    version: 12.10.0
    namespace: vydon
    createNamespace: false

    values:
      - auth:
          postgresPassword: foofar
          database: vydon
        primary:
          persistence:
            mountPath: "/vydon/vydon-postgres"
            existingClaim: vydon-postgres # see pvc in ../yaml/vydon-postgres-pvc.yaml
        postgresqlDataDir: "/vydon/vydon-postgres/data"
