extends:
  - "@commitlint/config-conventional"
rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - perf
      - refactor
      - docs
      - test
      - build
      - ci
      - chore
      - style
      - revert
  subject-case:
    - 2
    - always
    - lower-case
  subject-full-stop:
    - 2
    - never
    - "."
  header-max-length:
    - 2
    - always
    - 72
  body-max-line-length:
    - 2
    - always
    - 72
