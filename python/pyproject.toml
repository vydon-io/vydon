[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vydon"
dynamic = ["version"]
authors = [
  { name = "Vydon Dev Team", email="devops@vydon-io.com"}
]
description = "Vydon Python SDK"
requires-python = ">=3.8"
readme = "README.md"
dependencies = [
  "grpcio==1.69.*",
  "protobuf==5.*",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
  "Topic :: Utilities",
]
keywords = [
  "vydon",
  "data",
  "privacy",
  "anonymization",
  "data-privacy",
  "data-anonymization",
  "data-protection",
  "data-masking",
  "data-obfuscation",
  "data-scrubbing",
  "data-de-identification",
]

[project.urls]
Homepage = "https://github.com/vydon-io/vydon"
Issues = "https://github.com/vydon-io/vydon/issues"
Documentation = "https://docs.vydon.dev/api/python"


[tool.hatch.version]
source = "vcs"
