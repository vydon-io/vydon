name: Vydon CodeQL config

queries:
  - uses: security-and-quality

paths-ignore:
  - "**/backend/gen/**"
  - "**/frontend/packages/sdk/src/client/**"
  - "**/frontend/packages/sdk/dist/**"
  - "**/frontend/.next/**"
  - "**/node_modules/**"
  - "**/python/src/vydon/mgmt/**"
  - "**/dist/**"
  - "**/charts/**/values.yaml"

query-filters:
  - exclude:
      id: js/clear-text-storage-of-sensitive-data
  - exclude:
      id: js/xss-through-dom
  # Helm values.yaml uses empty placeholder fields by convention; operators
  # set real values via -f overrides or external-secret integrations.
  - exclude:
      id: js/empty-password-in-configuration-file
