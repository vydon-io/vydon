on:
  pull_request:
    paths:
      - backend/protos/**
      - BUF_VERSION
      - buf.gen.yaml
      - buf.work.yaml

name: Buf

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    name: buf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Retrieve Buf Version
        id: buf-version
        run: |
          VER=$(cat BUF_VERSION)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          version: ${{ steps.buf-version.outputs.version }}
          token: ${{ secrets.BUF_TOKEN }}
          push: false # we don't want to push to the BSR
          push_disable_create: true
          breaking: false # rebrand re-baselines wire types; breaking comparisons resume once main has the renamed schemas
