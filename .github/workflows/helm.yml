on:
  pull_request:
    paths:
      - charts/**
      - backend/charts/**
      - worker/charts/**
      - frontend/apps/web/charts/**

name: Helm
jobs:
  lint:
    name: Check Helm Readmes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helm-docs
        run: |
          curl -sSLo helm-docs.tar.gz https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar -xf helm-docs.tar.gz helm-docs
          sudo mv helm-docs /usr/local/bin/

      - name: Regenerate docs
        run: helm-docs --chart-search-root=.

      - name: Check no drift
        run: |
          if ! git diff --exit-code; then
            echo "Helm chart README is stale. Run helm-docs locally and commit." >&2
            exit 1
          fi
