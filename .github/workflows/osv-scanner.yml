name: OSV Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan dependencies
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      # Scope the scan to Go modules: those are the artefacts we ship as binaries.
      # Frontend npm advisories are covered by GitHub Dependabot and the native
      # dependency-review action on every pull request.
      scan-args: |-
        --no-call-analysis=go
        --config=./osv-scanner.toml
        --lockfile=./go.mod
        --lockfile=./tools/go.mod
