version: 2

# ---------------------------------------------------------------------------
# Dependabot configuration for Vydon.
#
# - Commit messages follow Conventional Commits (build(deps): ...).
# - Labels: every PR gets `dependencies` and the ecosystem-specific label so
#   maintainers can filter at a glance.
# - Reviewer assignment is handled via CODEOWNERS (the deprecated `reviewers`
#   key has been removed).
# - Minor + patch bumps are grouped per-ecosystem to reduce PR noise; majors
#   ship as individual PRs so each can get a focused review.
# - open-pull-requests-limit is raised to 10 to fit the broader bump surface.
# ---------------------------------------------------------------------------

updates:
  # Backend / worker / cli / internal Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # tools/ Go module (sqlc, mockery, buf, etc.)
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
      - tooling
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      go-tools-minor-patch:
        update-types:
          - minor
          - patch

  # Root npm tooling (commitlint, lefthook)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
      - tooling
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      npm-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    versioning-strategy: increase

  # Frontend monorepo
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
      - frontend
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      frontend-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
      frontend-prod:
        dependency-type: production
        update-types:
          - minor
          - patch
    versioning-strategy: increase

  # Documentation (Docusaurus)
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - docs
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      docs:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
