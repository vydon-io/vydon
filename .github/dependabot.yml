version: 2
updates:
  # Enable version updates for go
  - package-ecosystem: "gomod"
    schedule:
      interval: "daily"
    labels:
      - dependencies
    directory: "/"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      golang-minor:
        update-types:
          - minor
          - patch
    reviewers:
      - nickzelei
  - package-ecosystem: "gomod"
    schedule:
      interval: "daily"
    labels:
      - dependencies
    directory: "tools"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      golang-minor:
        update-types:
          - minor
          - patch
    reviewers:
      - nickzelei

  # Root npm tooling (commitlint, lefthook)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      npm-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    versioning-strategy: increase

  - package-ecosystem: "npm"
    directory: "frontend"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
    reviewers:
      - nickzelei
    versioning-strategy: increase

  - package-ecosystem: "npm"
    directory: "docs"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      npm-all-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    reviewers:
      - nickzelei

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
    reviewers:
      - nickzelei
