releases:
  - name: vydon-app
    chart: ../../../charts/app
    version: 'v0.0.0'
    namespace: vydon
    createNamespace: false

    values:
      -
        image:
          repository: vydon-app

        serviceAccount:
          create: true

        vydonEnv: dev

        servicePort: 80
        containerPort: 3000

        vydonApi:
          url: http://vydon-api

        auth:
          enabled: false

