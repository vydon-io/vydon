apiVersion: v1
kind: Secret
metadata:
    name: {{ template "vydon-app.fullname" . }}-service-evs-{{ include "vydon-app.env-vars" . | sha256sum | trunc 8 }}
    namespace: {{ .Release.Namespace }}
    annotations:
        checksum/stringdata: {{ include "vydon-app.env-vars" . | sha256sum }}
type: Opaque
stringData:
{{ include "vydon-app.env-vars" . | indent 4 }}
