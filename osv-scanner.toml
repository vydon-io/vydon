# OSV Scanner configuration.
#
# Each entry below is a vulnerability we are aware of and have accepted for
# the duration in `ignoreUntil`. Acceptance does not mean dismissal: it means
# the fix is non-trivial (API breaking upstream bump, runtime version pin,
# or transitive constraint) and we are tracking it separately.
#
# Process:
#   - every entry must have an `ignoreUntil` no further than 90 days out
#   - every entry must justify *why* it cannot be patched in-place right now
#   - the list is reviewed before every release branch cut
#
# Re-run after edits:
#   docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:latest \
#     --recursive --no-call-analysis=go ./

